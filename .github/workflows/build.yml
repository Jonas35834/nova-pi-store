name: Build Nova Pi Store

on:

  # ------------------------------------------------------------
  # Nur starten, wenn VERSION geändert wurde
  # ------------------------------------------------------------

  push:
    branches:
      - main

    paths:
      - "VERSION"


  # ------------------------------------------------------------
  # Manueller Start weiterhin möglich
  # ------------------------------------------------------------

  workflow_dispatch:


permissions:

  contents: write
  pages: write
  id-token: write


jobs:

  # ============================================================
  # VERSION
  # ============================================================

  version:

    name: Read Version

    runs-on: ubuntu-latest

    outputs:

      version: ${{ steps.version.outputs.version }}

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Read VERSION

        id: version

        run: |

          if [ ! -f VERSION ]; then

            echo "FEHLER: VERSION Datei nicht gefunden."

            exit 1

          fi


          VERSION="$(cat VERSION | tr -d '[:space:]')"


          if [ -z "$VERSION" ]; then

            echo "FEHLER: VERSION ist leer."

            exit 1

          fi


          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then

            echo "FEHLER: Ungültige Version: $VERSION"

            echo "Erwartetes Format: 1.2.3"

            exit 1

          fi


          echo "Version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


  # ============================================================
  # BUILD
  # ============================================================

  build:

    name: Build Debian Package and APT Repository

    needs: version

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Repository
      # ----------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Version anzeigen
      # ----------------------------------------------------------

      - name: Show version

        run: |

          echo "======================================"

          echo "Nova Pi Store"

          echo "Version: ${{ needs.version.outputs.version }}"

          echo "======================================"


      # ----------------------------------------------------------
      # Projektstruktur
      # ----------------------------------------------------------

      - name: Check project structure

        run: |

          find . \
            -maxdepth 4 \
            -type f \
            | sort


      # ----------------------------------------------------------
      # Debian Tools
      # ----------------------------------------------------------

      - name: Check Debian tools

        run: |

          dpkg-deb --version


      # ----------------------------------------------------------
      # Skripte ausführbar machen
      # ----------------------------------------------------------

      - name: Make scripts executable

        run: |

          chmod +x scripts/build-deb.sh

          chmod +x scripts/build-repository.sh

          chmod +x scripts/install.sh


      # ----------------------------------------------------------
      # Debian Paket bauen
      # ----------------------------------------------------------

      - name: Build Debian package

        run: |

          ./scripts/build-deb.sh \
            "${{ needs.version.outputs.version }}"


      # ----------------------------------------------------------
      # Debian Paket prüfen
      # ----------------------------------------------------------

      - name: Check Debian package

        run: |

          echo "Generated package:"

          ls -lh *.deb

          echo

          dpkg-deb --info *.deb


      # ----------------------------------------------------------
      # APT Repository bauen
      # ----------------------------------------------------------

      - name: Build APT repository

        run: |

          ./scripts/build-repository.sh \
            "${{ needs.version.outputs.version }}"


      # ----------------------------------------------------------
      # APT Repository prüfen
      # ----------------------------------------------------------

      - name: Check APT repository

        run: |

          echo "APT repository:"

          find apt-repository \
            -type f \
            -print \
            | sort


          echo

          echo "Release:"

          cat \
            apt-repository/dists/stable/Release


          echo

          echo "Packages:"

          cat \
            apt-repository/dists/stable/main/binary-all/Packages


      # ----------------------------------------------------------
      # Debian Artifact
      # ----------------------------------------------------------

      - name: Upload Debian package

        uses: actions/upload-artifact@v4

        with:

          name: nova-pi-store-deb

          path: "*.deb"

          if-no-files-found: error


      # ----------------------------------------------------------
      # APT Repository Artifact
      # ----------------------------------------------------------

      - name: Upload APT repository

        uses: actions/upload-artifact@v4

        with:

          name: nova-pi-store-apt

          path: apt-repository

          if-no-files-found: error


      # ----------------------------------------------------------
      # GitHub Release
      # ----------------------------------------------------------

      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: v${{ needs.version.outputs.version }}

          name: Nova Pi Store v${{ needs.version.outputs.version }}

          body: |

            # 🍓 Nova Pi Store v${{ needs.version.outputs.version }}

            Nova Pi Store für Raspberry Pi OS Lite.

            ## Installation

            ```bash
            sudo apt update
            sudo apt install nova-pi-store
            ```

            Die Weboberfläche läuft anschließend
            standardmäßig auf Port 8080.

          files: "*.deb"

          make_latest: true


  # ============================================================
  # GITHUB PAGES
  # ============================================================

  pages:

    name: Deploy GitHub Pages

    needs:
      - version
      - build

    runs-on: ubuntu-latest


    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      # ----------------------------------------------------------
      # Repository
      # ----------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # APT Repository herunterladen
      # ----------------------------------------------------------

      - name: Download APT repository

        uses: actions/download-artifact@v4

        with:

          name: nova-pi-store-apt

          path: apt-repository


      # ----------------------------------------------------------
      # GitHub Pages vorbereiten
      # ----------------------------------------------------------

      - name: Prepare GitHub Pages

        run: |

          echo "======================================"

          echo "Preparing GitHub Pages"

          echo "Version: ${{ needs.version.outputs.version }}"

          echo "======================================"


          mkdir -p pages


          # ------------------------------------------------------
          # Startseite
          # ------------------------------------------------------

          if [ ! -f index.html ]; then

            echo "FEHLER: index.html wurde nicht gefunden."

            exit 1

          fi


          cp index.html pages/index.html


          # ------------------------------------------------------
          # APT Repository
          # ------------------------------------------------------

          if [ ! -d apt-repository ]; then

            echo "FEHLER: apt-repository wurde nicht gefunden."

            exit 1

          fi


          cp -r apt-repository/* pages/


          # ------------------------------------------------------
          # apps.json
          # ------------------------------------------------------

          if [ -f app/apps.json ]; then

            cp app/apps.json pages/apps.json

          elif [ -f apps.json ]; then

            cp apps.json pages/apps.json

          else

            echo "WARNUNG: apps.json wurde nicht gefunden."

          fi


          # ------------------------------------------------------
          # VERSION
          # ------------------------------------------------------

          cp VERSION pages/VERSION


          # ------------------------------------------------------
          # Übersicht
          # ------------------------------------------------------

          echo

          echo "GitHub Pages structure:"

          find pages \
            -type f \
            | sort


      # ----------------------------------------------------------
      # Pages Artifact
      # ----------------------------------------------------------

      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:

          path: "./pages"


      # ----------------------------------------------------------
      # Deploy
      # ----------------------------------------------------------

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4
