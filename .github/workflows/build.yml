name: Build Nova Pi Store

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  build:

    name: Build Debian Package and APT Repository

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Check Debian tools
        run: |
          dpkg-deb --version


      - name: Check project structure
        run: |
          echo "Project structure:"
          find . -maxdepth 4 -type f | sort


      - name: Make scripts executable
        run: |
          chmod +x scripts/build-deb.sh
          chmod +x scripts/build-repository.sh


      - name: Build Debian package
        run: |
          ./scripts/build-deb.sh 1.0.0


      - name: Check Debian package
        run: |
          echo "Generated package:"
          ls -lh *.deb
          echo
          echo "Package information:"
          dpkg-deb --info *.deb


      - name: Build APT repository
        run: |
          ./scripts/build-repository.sh 1.0.0


      - name: Check APT repository
        run: |
          echo
          echo "APT repository:"
          echo

          find apt-repository \
            -type f \
            -print \
            | sort

          echo
          echo "Packages:"
          echo

          cat \
            apt-repository/dists/stable/main/binary-all/Packages


      - name: Upload Debian package
        uses: actions/upload-artifact@v4

        with:
          name: nova-pi-store-deb

          path: "*.deb"

          if-no-files-found: error


      - name: Upload APT repository
        uses: actions/upload-pages-artifact@v3

        with:
          path: "./apt-repository"


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: v1.0.0

          name: Nova Pi Store v1.0.0

          body: |
            # 🍓 Nova Pi Store v1.0.0

            Erste Version des Nova Pi Store.

            ## Installation

            Die Debian-Datei kann direkt installiert werden:

            ```bash
            sudo apt install ./nova-pi-store_1.0.0_all.deb
            ```

            Die Weboberfläche läuft anschließend auf Port 8080.

          files: |
            *.deb

          make_latest: true


  deploy:

    name: Deploy APT Repository

    needs: build

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy GitHub Pages
        id: deployment

        uses: actions/deploy-pages@v4
