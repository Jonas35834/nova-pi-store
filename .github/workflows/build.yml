name: Build Nova Pi Store

on:

  push:
    branches:
      - main

  workflow_dispatch:


permissions:

  contents: write

  pages: write

  id-token: write


jobs:

  build:

    name: Build Debian Package

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Debian repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev


      - name: Make scripts executable
        run: |
          chmod +x scripts/build-deb.sh
          chmod +x scripts/build-repository.sh


      - name: Build Debian package
        run: |
          ./scripts/build-deb.sh 1.0.0


      - name: Build APT repository
        run: |
          ./scripts/build-repository.sh 1.0.0


      - name: Check repository
        run: |
          find apt-repository -type f | sort


      - name: Upload Debian package
        uses: actions/upload-artifact@v4

        with:
          name: nova-pi-store-deb

          path: "*.deb"


      - name: Upload APT repository
        uses: actions/upload-pages-artifact@v3

        with:
          path: "./apt-repository"


  deploy:

    name: Deploy APT Repository

    needs: build

    runs-on: ubuntu-latest


    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy GitHub Pages
        id: deployment

        uses: actions/deploy-pages@v4
