name: Build Nova Pi Store

on:

  push:
    branches:
      - main

  workflow_dispatch:


permissions:

  contents: write
  pages: write
  id-token: write


jobs:

  # ============================================================
  # BUILD
  # ============================================================

  build:

    name: Build Debian Package and APT Repository

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Repository
      # ----------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Projektstruktur
      # ----------------------------------------------------------

      - name: Check project structure

        run: |

          echo "======================================"
          echo "Project structure"
          echo "======================================"

          find . \
            -maxdepth 4 \
            -type f \
            | sort


      # ----------------------------------------------------------
      # Debian Tools
      # ----------------------------------------------------------

      - name: Check Debian tools

        run: |

          dpkg-deb --version


      # ----------------------------------------------------------
      # Skripte ausführbar machen
      # ----------------------------------------------------------

      - name: Make scripts executable

        run: |

          chmod +x scripts/build-deb.sh
          chmod +x scripts/build-repository.sh
          chmod +x scripts/install.sh


      # ----------------------------------------------------------
      # Debian Paket bauen
      # ----------------------------------------------------------

      - name: Build Debian package

        run: |

          ./scripts/build-deb.sh 1.1.1


      # ----------------------------------------------------------
      # Debian Paket prüfen
      # ----------------------------------------------------------

      - name: Check Debian package

        run: |

          echo
          echo "Generated package:"
          echo

          ls -lh *.deb

          echo
          echo "Package information:"
          echo

          dpkg-deb --info *.deb


      # ----------------------------------------------------------
      # APT Repository bauen
      # ----------------------------------------------------------

      - name: Build APT repository

        run: |

          ./scripts/build-repository.sh 1.1.1


      # ----------------------------------------------------------
      # APT Repository prüfen
      # ----------------------------------------------------------

      - name: Check APT repository

        run: |

          echo
          echo "APT repository:"
          echo

          find apt-repository \
            -type f \
            -print \
            | sort

          echo
          echo "--------------------------------------"
          echo "Release"
          echo "--------------------------------------"
          echo

          cat \
            apt-repository/dists/stable/Release

          echo
          echo "--------------------------------------"
          echo "Packages"
          echo "--------------------------------------"
          echo

          cat \
            apt-repository/dists/stable/main/binary-all/Packages


      # ----------------------------------------------------------
      # Debian Artifact
      # ----------------------------------------------------------

      - name: Upload Debian package

        uses: actions/upload-artifact@v4

        with:

          name: nova-pi-store-deb

          path: "*.deb"

          if-no-files-found: error


      # ----------------------------------------------------------
      # APT Repository Artifact
      # ----------------------------------------------------------

      - name: Upload APT repository

        uses: actions/upload-artifact@v4

        with:

          name: nova-pi-store-apt

          path: apt-repository

          if-no-files-found: error


      # ----------------------------------------------------------
      # GitHub Release
      # ----------------------------------------------------------

      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: v1.1.1

          name: Nova Pi Store v1.1.1

          body: |

            # 🍓 Nova Pi Store v1.1.1

            Nova Pi Store für Raspberry Pi OS Lite.

            ## Installation

            ```bash
            sudo apt update
            sudo apt install nova-pi-store
            ```

            Die Weboberfläche läuft anschließend
            standardmäßig auf Port 8080.

          files: "*.deb"

          make_latest: true


  # ============================================================
  # GITHUB PAGES
  # ============================================================

  pages:

    name: Deploy GitHub Pages

    needs: build

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      # ----------------------------------------------------------
      # Repository
      # ----------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # APT Repository herunterladen
      # ----------------------------------------------------------

      - name: Download APT repository

        uses: actions/download-artifact@v4

        with:

          name: nova-pi-store-apt

          path: apt-repository


      # ----------------------------------------------------------
      # GitHub Pages vorbereiten
      # ----------------------------------------------------------

      - name: Prepare GitHub Pages

        run: |

          echo "======================================"
          echo "Preparing GitHub Pages"
          echo "======================================"


          mkdir -p pages


          # ------------------------------------------------------
          # Startseite
          # ------------------------------------------------------

          if [ ! -f index.html ]; then

            echo "FEHLER: index.html wurde nicht gefunden."

            exit 1

          fi


          cp index.html pages/index.html


          # ------------------------------------------------------
          # APT Repository
          # ------------------------------------------------------

          if [ ! -d apt-repository ]; then

            echo "FEHLER: apt-repository wurde nicht gefunden."

            exit 1

          fi


          cp -r apt-repository/* pages/


          # ------------------------------------------------------
          # apps.json veröffentlichen
          # ------------------------------------------------------

          if [ -f app/apps.json ]; then

            cp app/apps.json pages/apps.json

          elif [ -f apps.json ]; then

            cp apps.json pages/apps.json

          else

            echo "WARNUNG: apps.json wurde nicht gefunden."

          fi


          # ------------------------------------------------------
          # Übersicht
          # ------------------------------------------------------

          echo
          echo "======================================"
          echo "GitHub Pages structure"
          echo "======================================"
          echo

          find pages \
            -type f \
            | sort


      # ----------------------------------------------------------
      # Pages Artifact
      # ----------------------------------------------------------

      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:

          path: "./pages"


      # ----------------------------------------------------------
      # Deploy
      # ----------------------------------------------------------

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4
